services:
  - type: web
    name: ai-church-system
    runtime: docker
    plan: free
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: FLASK_ENV
        value: production
      - key: FLASK_DEBUG
        value: "0"
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: ai-church-system-db
          property: connectionString
      - key: FRONTEND_ORIGIN
        value: https://ai-church-system.onrender.com
      - key: VITE_API_BASE_URL
        value: /api
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: BIBLE_API_BASE_URL
        value: https://api.scripture.api.bible/v1
      - key: BIBLE_API_KEY
        sync: false

databases:
  - name: ai-church-system-db
    plan: free
    databaseName: ai_church_system
    user: ai_church_system
